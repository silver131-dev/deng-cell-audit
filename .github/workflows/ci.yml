name: Synthetic audit checks

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested dependencies
        run: python -m pip install -r requirements-tested.txt
      - name: Install package
        run: python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Synthetic demo
        run: python -m deng_cell_audit demo --out results/ci-demo
      - name: Verify candidate files
        run: python tools/verify_release.py
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Build reviewed archive
        run: python tools/build_release.py --out dist/deng-cell-audit-v0.1.0-rc3.zip

